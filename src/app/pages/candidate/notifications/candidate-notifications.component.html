<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-yellow-100 flex items-center justify-center">
          <mat-icon class="text-yellow-600 text-2xl!">notifications</mat-icon>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-800 m-0">Notifications</h1>
          <p class="text-gray-500 text-sm m-0 mt-1">
            <span *ngIf="unreadCount > 0" class="text-blue-600 font-semibold">
              {{ unreadCount }} non lue(s)
            </span>
            <span *ngIf="unreadCount === 0">Tout est à jour</span>
          </p>
        </div>
      </div>
      <button *ngIf="unreadCount > 0"
        mat-stroked-button color="primary" (click)="markAllAsRead()">
        <mat-icon>done_all</mat-icon>
        Tout marquer comme lu
      </button>
    </div>
  </div>

  <!-- Filtres -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
    <div class="flex flex-wrap gap-2">
      <button *ngFor="let f of filters"
        (click)="filter = f.value"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm
          font-medium transition-all border cursor-pointer"
        [ngClass]="filter === f.value
          ? 'bg-blue-500 text-white border-blue-500'
          : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300'">
        {{ f.label }}
        <span class="px-1.5 py-0.5 rounded-full text-xs"
          [ngClass]="filter === f.value
            ? 'bg-white text-blue-600'
            : 'bg-gray-100 text-gray-500'">
          {{ f.count }}
        </span>
      </button>
    </div>
  </div>

  <!-- Liste notifications -->
  <div class="space-y-3">
    <div *ngIf="filteredNotifications.length === 0"
      class="bg-white rounded-2xl p-8 text-center shadow-sm border border-gray-100">
      <mat-icon class="text-gray-300 text-5xl! mb-3">notifications_none</mat-icon>
      <p class="text-gray-500 font-medium">Aucune notification</p>
    </div>

    <div *ngFor="let notif of filteredNotifications"
      class="bg-white rounded-2xl shadow-sm border transition-all"
      [ngClass]="notif.read
        ? 'border-gray-100'
        : 'border-blue-200 shadow-blue-50'">

      <div class="p-4 flex items-start gap-4">

        <!-- Icône -->
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" 
     [ngClass]="getUiConfig(notif.type).color">
  <mat-icon class="text-xl!">{{ getUiConfig(notif.type).icon }}</mat-icon>
</div>

        <!-- Contenu -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <p class="text-sm font-bold text-gray-800 m-0">
                  {{ notif.title }}
                </p>
                <span *ngIf="!notif.read"
                  class="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0">
                </span>
              </div>
              <p class="text-sm text-gray-500 m-0 mt-1">{{ notif.message }}</p>
              <p class="text-xs text-gray-400 m-0 mt-2">{{ notif.time }}</p>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-2 mt-3">
            <a [routerLink]="notif.route"
              class="text-xs text-blue-600 font-medium hover:underline cursor-pointer">
              Voir →
            </a>
            <span class="text-gray-300">|</span>
            <button *ngIf="!notif.read"
              (click)="markAsRead(notif)"
              class="text-xs text-gray-500 hover:text-gray-700 cursor-pointer
                border-none bg-transparent p-0">
              Marquer comme lu
            </button>
            <button
              (click)="deleteNotification(notif.id)"
              class="text-xs text-red-400 hover:text-red-600 cursor-pointer
                border-none bg-transparent p-0 ml-auto">
              Supprimer
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
