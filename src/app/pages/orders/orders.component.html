<div class="p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Orders</h1>
      <p class="text-gray-500 text-sm mt-1">Gestion des transactions et paiements</p>
    </div>
    <span class="bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full">
      {{ total }} orders
    </span>
  </div>

  <!-- Filtres -->
  <mat-card class="cardWithShadow mb-6">
    <mat-card-content class="p-4">
      <div class="flex items-center gap-4">
        <mat-form-field appearance="outline" class="w-52">
          <mat-label>Statut</mat-label>
          <mat-select [(ngModel)]="selectedStatus" (selectionChange)="onStatusChange()">
            <mat-option *ngFor="let s of statuts" [value]="s.value">
              {{ s.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-stroked-button color="primary" (click)="loadOrders()">
          Actualiser
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Tableau -->
  <mat-card class="cardWithShadow">
    <mat-card-content>

      <div *ngIf="loading" class="flex justify-center py-10">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="!loading" class="overflow-x-auto">
        <table mat-table [dataSource]="orders" class="w-full">

          <!-- Order ID -->
          <ng-container matColumnDef="orderId">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Order ID</th>
            <td mat-cell *matCellDef="let o">
              <span class="text-xs font-mono text-gray-500">
                {{ o.orderId | slice:0:8 }}...
              </span>
            </td>
          </ng-container>

          <!-- Booking ID -->
          <ng-container matColumnDef="bookingId">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Booking ID</th>
            <td mat-cell *matCellDef="let o">
              <span class="text-xs font-mono text-gray-600">{{ o.bookingId }}</span>
            </td>
          </ng-container>

          <!-- Type -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Type</th>
            <td mat-cell *matCellDef="let o">
              <span class="px-2 py-1 rounded-full text-xs font-medium"
                [ngClass]="getTypeClass(o.type)">
                {{ o.type }}
              </span>
            </td>
          </ng-container>

          <!-- Statut -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Statut</th>
            <td mat-cell *matCellDef="let o">
              <span class="px-2 py-1 rounded-full text-xs font-medium"
                [ngClass]="getStatusClass(o.status)">
                {{ getStatusLabel(o.status) }}
              </span>
            </td>
          </ng-container>

          <!-- Date -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Date</th>
            <td mat-cell *matCellDef="let o">
              <span class="text-sm text-gray-600">{{ o.date }}</span>
            </td>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Actions</th>
            <td mat-cell *matCellDef="let o">
              <div class="flex items-center gap-1">

                <!-- Changer statut -->
                <button mat-icon-button
                  [matMenuTriggerFor]="statusMenu"
                  matTooltip="Changer statut">
                  <mat-icon>edit</mat-icon>
                </button>
                <mat-menu #statusMenu="matMenu">
                  <button mat-menu-item *ngFor="let s of statuts.slice(1)"
                    (click)="updateStatus(o._id, s.value)">
                    {{ s.label }}
                  </button>
                </mat-menu>

                <!-- Supprimer -->
                <button mat-icon-button color="warn"
                  (click)="deleteOrder(o._id)"
                  matTooltip="Supprimer">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            class="hover:bg-gray-50 transition-colors"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-8 text-gray-500"
              [attr.colspan]="displayedColumns.length">
              Aucun order trouvé
            </td>
          </tr>
        </table>

        <mat-paginator
          [length]="total"
          [pageSize]="limit"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>

    </mat-card-content>
  </mat-card>
</div>
