<header class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <a routerLink="/candidate/dashboard" class="flex items-center gap-3 no-underline">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center">
          <mat-icon class="text-white text-lg!">flight_takeoff</mat-icon>
        </div>
        <div class="hidden sm:block">
          <p class="text-base font-bold text-gray-800 m-0 leading-tight">ImmiPro</p>
          <p class="text-xs text-gray-400 m-0">Portail Candidat</p>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1">
        <a *ngFor="let link of navLinks"
          [routerLink]="link.route"
          routerLinkActive="bg-blue-50 text-blue-600!"
          class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-800 transition-all no-underline">
          <mat-icon class="text-base! w-5! h-5!">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      </nav>

      <div class="flex items-center gap-3">

        <button mat-icon-button routerLink="/candidate/notifications" class="relative group">
          <mat-icon class="text-gray-500 group-hover:text-gray-700 transition-colors">
            {{ unreadCount > 0 ? 'notifications' : 'notifications_none' }}
          </mat-icon>
          <span *ngIf="unreadCount > 0" class="absolute top-1.5 right-1.5 flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
          </span>
        </button>

        <button [matMenuTriggerFor]="profileMenu"
          class="flex items-center gap-2 px-2 py-1 rounded-xl hover:bg-gray-50 transition-all cursor-pointer border-none bg-transparent">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
            <span class="text-white text-sm font-bold">{{ getInitials() }}</span>
          </div>
          <span class="hidden sm:block text-sm font-semibold text-gray-700">
            {{ currentUser?.nom }}
          </span>
          <mat-icon class="text-gray-400 text-base!">expand_more</mat-icon>
        </button>

        <mat-menu #profileMenu="matMenu" xPosition="before">
          <div class="px-4 py-3 border-b border-gray-100" style="min-width: 230px;">
            <p class="text-sm font-bold text-gray-800 m-0">
              {{ currentUser?.nom }} {{ currentUser?.prenom }}
            </p>
            <p class="text-xs text-gray-500 m-0 mt-0.5">{{ currentUser?.email }}</p>
          </div>
          
          <div class="px-3 pt-2">
            <a routerLink="/candidate/profile"
              class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl
                bg-gray-50 hover:bg-blue-50 border border-gray-200
                hover:border-blue-200 transition-all cursor-pointer text-gray-700
                hover:text-blue-600 no-underline">
              
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600
                to-indigo-700 flex items-center justify-center flex-shrink-0">
                <span class="text-white text-xs font-bold">
                  {{ getInitials() }}
                </span>
              </div>
              
              <div class="flex-1">
                <p class="text-sm font-semibold m-0 leading-tight">Mon profil</p>
                <p class="text-xs text-gray-400 m-0">Paramètres du compte</p>
              </div>
              
              <mat-icon class="text-gray-300 text-base">chevron_right</mat-icon>
            </a>
          </div>

          <div class="px-3 py-2 border-t border-gray-100 mt-2">
            <button (click)="logout()"
              class="w-full flex items-center gap-2 px-3 py-2 rounded-lg border border-red-200 text-red-600 text-sm font-medium hover:bg-red-50 transition-colors cursor-pointer bg-white">
              <mat-icon class="text-base!">logout</mat-icon>
              Se déconnecter
            </button>
          </div>
        </mat-menu>

      </div>
    </div>
  </div>
</header>
