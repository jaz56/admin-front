<div class="mb-6">

  <!-- Ligne 1 : Breadcrumb + Date -->
  <div class="flex items-center justify-between mb-3">

    <!-- Breadcrumbs -->
    <nav class="flex items-center gap-1 text-sm text-gray-500">
      <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
        <a *ngIf="crumb.url && !last"
          [routerLink]="crumb.url"
          class="hover:text-blue-600 transition-colors font-medium">
          {{ crumb.label }}
        </a>
        <span *ngIf="!crumb.url || last"
          [ngClass]="last ? 'text-gray-800 font-semibold' : ''">
          {{ crumb.label }}
        </span>
        <mat-icon *ngIf="!last"
          class="text-gray-300 text-sm! w-4! h-4!">
          chevron_right
        </mat-icon>
      </ng-container>
    </nav>

    <!-- Date dynamique -->
        <div class="flex items-center gap-2 text-sm text-gray-500">
        <i data-icon="solar:calendar-line-duotone" 
            class="iconify text-blue-400 flex-shrink-0" 
            style="font-size: 18px; width: 18px; height: 18px;">
        </i>
        <span>{{ currentDate | date:"EEEE d MMMM yyyy" }}</span>
        </div>

  </div>

  <!-- Ligne 2 : Titre + sous-titre -->
  <div *ngIf="title">
    <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
    <p *ngIf="subtitle" class="text-gray-500 text-sm mt-1">{{ subtitle }}</p>
  </div>

  <!-- Ligne 3 : Alertes urgentes -->
  <div *ngIf="alerts.length > 0" class="mt-3">
    <div class="flex items-start gap-3 bg-amber-50 border border-amber-200
      rounded-lg px-4 py-3">
      <mat-icon class="text-amber-500 flex-shrink-0 mt-0.5">notifications_active</mat-icon>
      <div>
        <p class="text-sm font-semibold text-amber-800 mb-1">
          Actions requises
        </p>
        <ul class="space-y-1">
          <li *ngFor="let alert of alerts"
            class="text-sm text-amber-700 flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 flex-shrink-0"></span>
            {{ alert }}
          </li>
        </ul>
      </div>
    </div>
  </div>

</div>
